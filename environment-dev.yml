name: lbnenvdev
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - osmnx>=2
  - scipy
  - geojson
  - tqdm
  - bikenetlib

  # additional to the non-dev env
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-mpl
  - pytest-cov
  - sphinx
  - numpydoc
  - myst-nb
  - pre-commit
  - jupyterlab
  - pixi-kernel
  - pip:
      # not available via conda-forge:
      - sphinx-copybutton
      - sphinxext-opengraph
      - furo
      - linkbikenet